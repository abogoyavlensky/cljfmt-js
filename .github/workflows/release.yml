name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3.6.1

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('deps.edn') }}
          restore-keys: m2-

      - run: npm ci

      # The tag is what consumers pin, so never publish an unchecked build.
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: bb check

      - run: bb pack

      - name: Generate checksums
        run: sha256sum abogoyavlensky-cljfmt-js-*.tgz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Assets are immutable: consumers pin a URL plus an integrity hash,
          # so a rerun must fail rather than replace a published tarball.
          overwrite_files: false
          files: |
            abogoyavlensky-cljfmt-js-*.tgz
            checksums.txt
